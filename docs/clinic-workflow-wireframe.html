<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>診務協作｜互動線框</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#25333f;font:15px/1.6 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #dce2e7;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1280px;margin:28px auto;padding:0 24px}h1{font-size:26px;margin:0}h2{font-size:18px}p{color:#667581}button,input,textarea,select{font:inherit}button{cursor:pointer;background:white;border:1px solid #cad3db;padding:8px 14px;border-radius:7px;color:inherit}button.active,button.primary{background:#285c65;color:#fff;border-color:#285c65}button:disabled{opacity:.45;cursor:default}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0;flex-wrap:wrap}.group{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #dce2e7;border-radius:10px;padding:20px}.stats strong{display:block;font-size:25px}.muted,small{color:#6c7b87}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px}.row{display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid #e7ebee}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:12px;padding:3px 8px;border-radius:5px;background:#eef1f4}.done{background:#e4f1e9;color:#286044}.pending{background:#fff1d9;color:#86611b}table{width:100%;border-collapse:collapse}td,th{padding:14px 8px;text-align:left;border-bottom:1px solid #e7ebee}th{font-size:13px;color:#667581}label{display:block;margin:16px 0 6px}input,textarea,select{width:100%;padding:10px;border:1px solid #cad3db;border-radius:6px;background:#fff}textarea{min-height:100px;resize:vertical}.footer{position:sticky;bottom:0;background:white;padding:14px;border-top:1px solid #dce2e7;display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:20px}.notice{padding:12px;background:#edf3f5;border-radius:7px}.empty{padding:35px;text-align:center;color:#6c7b87}#toast{position:fixed;bottom:22px;left:24px;background:#25333f;color:white;padding:12px 20px;border-radius:8px;display:none;z-index:2}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.panel{overflow:auto}header{align-items:flex-start;gap:12px}.row{grid-template-columns:55px 1fr}.row>button{grid-column:2}}
</style>
<header><div><b>診務協作</b><div class="muted">互動線框 · 虛構資料 · 操作僅保留於本頁</div></div><div class="group"><button id="vet" onclick="roleChange('vet')">醫師診療台</button><button id="desk" onclick="roleChange('desk')">櫃台工作台</button></div></header><main id="app"></main><div id="toast" role="status"></div>
<script>
const patients=[{id:1,time:'09:00',name:'豆豆',type:'犬 · 王小姐',reason:'皮膚搔癢複診',arrived:true,visit:false,billed:false,paid:false,amount:850,note:'',handoff:'請提醒飼主避免舔舐患部',follow:'7 天後追蹤皮膚狀況',booked:false,started:false},{id:2,time:'09:30',name:'咪咪',type:'貓 · 林先生',reason:'食慾下降',arrived:true,visit:true,billed:true,paid:false,amount:1200,note:'今日食慾改善，持續觀察。',handoff:'向飼主說明飲食觀察事項',follow:'3 天後追蹤食慾',booked:false,started:true},{id:3,time:'10:00',name:'可可',type:'犬 · 陳小姐',reason:'年度健康檢查',arrived:false,visit:false,billed:false,paid:false,amount:0,note:'',handoff:'',follow:'',booked:false,started:false}];
let role='vet',mode={vet:'timeline',desk:'timeline'},filter='all',selected=null,detail=false;const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function setView(view){mode[role]=view;render()}
function roleChange(r){role=r;filter='all';detail=false;render()}
function tags(p){return `<div class="tags"><span class="tag ${p.visit?'done':''}">${p.visit?'看診完成':p.started?'看診中':p.absent?'未到':p.arrived?'候診中':'待報到'}</span><span class="tag ${p.billed?'done':''}">${p.billed?'批價完成':'待批價'}</span><span class="tag ${p.paid?'done':p.billed?'pending':''}">${p.paid?'收款完成':'尚未收款'}</span></div>`}
function openPatient(id){selected=id;detail=role==='vet';render()}
function update(id,key,value){patients.find(p=>p.id===id)[key]=value;document.getElementById('saved')?.replaceChildren(document.createTextNode('已儲存於此線框'))}
function action(id,kind){const p=patients.find(p=>p.id===id);if(kind==='bill'){p.billed=true;toast('批價已送交櫃台，可切換櫃台查看')}if(kind==='visit'){p.visit=true;toast('看診完成，簡易紀錄已同步至病歷日誌示意')}if(kind==='pay'){p.paid=true;toast('收款完成，醫師端同步顯示')}if(kind==='arrive'){p.arrived=true;p.absent=false}if(kind==='absent'){p.absent=true}if(kind==='start'){p.started=true}if(kind==='book'){const v=document.getElementById('booking').value;if(!v){toast('請先選擇回診日期時間');return}p.booked=v;toast('已安排回診')}render()}
function matches(p,k){return k==='all'||k==='waiting'&&p.arrived&&!p.started||k==='active'&&p.started&&!p.visit||k==='billing'&&p.arrived&&!p.billed||k==='arrival'&&!p.arrived&&!p.absent||k==='payment'&&p.billed&&!p.paid||k==='follow'&&p.follow&&!p.booked}
function render(){document.getElementById('vet').className=role==='vet'?'active':'';document.getElementById('desk').className=role==='desk'?'active':'';if(detail){renderVisit();return}const filters=role==='vet'?[['all','全部'],['waiting','候診中'],['active','看診中'],['billing','待批價']]:[['all','全部'],['arrival','待報到'],['payment','待收款'],['follow','待安排回診']];let list=patients.filter(p=>matches(p,filter));if(mode[role]==='table'&&filter==='all')list=list.filter(p=>p.arrived);app.innerHTML=`<h1>${role==='vet'?'今日診務':'今日行政'}</h1><p>2026 年 9 月 7 日 · 星期一　<span class="tag done">示範同步中</span></p><div class="stats">${[['今日預約',patients.length],['候診中',patients.filter(p=>matches(p,'waiting')).length],['待收款',patients.filter(p=>matches(p,'payment')).length],['待安排回診',patients.filter(p=>matches(p,'follow')).length]].map(([s,n])=>`<div class="card"><span class="muted">${s}</span><strong>${n}</strong></div>`).join('')}</div><div class="bar"><div class="group">${filters.map(([k,s])=>`<button class="${filter===k?'active':''}" onclick="filter='${k}';render()">${s} ${patients.filter(p=>matches(p,k)).length}</button>`).join('')}</div><div class="group"><button class="${mode[role]==='timeline'?'active':''}" onclick="setView('timeline')">時間軸</button><button class="${mode[role]==='table'?'active':''}" onclick="setView('table')">候診表格</button></div></div><div class="${role==='desk'?'layout':''}"><section class="panel"><h2>${mode[role]==='timeline'?'全天安排':'候診與工作清單'}</h2>${mode[role]==='table'?'<p class="muted">「全部」顯示已報到病患；選擇待辦篩選可查看其他需處理病患。</p>':''}${list.length?mode[role]==='timeline'?list.map(p=>`<div class="row"><b>${p.time}</b><div><b>${p.name}</b> <small>${p.type}</small><div>${p.reason}</div>${tags(p)}${role==='desk'&&p.billed?`<div>應收 NT$${p.amount.toLocaleString()}</div>`:''}</div><button onclick="openPatient(${p.id})">${role==='vet'?'進入看診':'處理'}</button></div>`).join(''):`<table><thead><tr><th>病患／預約</th><th>${role==='vet'?'就診原因':'應收金額'}</th><th>工作狀態</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${p.name}</b><br><small>${p.time} · ${p.type}</small></td><td>${role==='vet'?p.reason:p.billed?'NT$'+p.amount:'待批價'}</td><td>${tags(p)}</td><td><button onclick="openPatient(${p.id})">${role==='vet'?'進入看診':'處理'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">目前沒有符合條件的病患</div>'}${mode[role]==='timeline'?'<div class="row"><b>10:30</b><span class="muted">空檔 · 可安排預約</span></div><div class="row"><b>14:00</b><span class="muted">下午診 · 尚無預約</span></div>':''}</section>${role==='desk'?deskPanel():''}</div>`}
function renderVisit(){const p=patients.find(p=>p.id===selected);app.innerHTML=`<button onclick="detail=false;render()">← 返回今日診務</button><div class="bar"><div><h1>${p.name} <small>${p.type}</small></h1><span>${p.reason}</span>${tags(p)}</div><button onclick="action(${p.id},'start')" ${p.started||!p.arrived?'disabled':''}>開始看診</button></div><div class="layout"><section class="panel"><h2>診療內容</h2><div class="notice">重要提醒：本區呈現已確認的過敏與病史資料</div><label>本次體重（kg）</label><input aria-label="本次體重" type="number" min="0" value="${p.weight||''}" oninput="update(${p.id},'weight',this.value)"><h2>病歷日誌</h2><p>08/31 · 皮膚搔癢，安排追蹤。（示範歷史紀錄）</p>${p.note?`<div class="notice">本次紀錄：${esc(p.note)}</div>`:''}<label>本次簡易紀錄</label><textarea oninput="update(${p.id},'note',this.value)">${esc(p.note)}</textarea><small>自動儲存至本次就診對應的病歷日誌，修改同一筆紀錄。</small><h2>正式表單</h2><p>每次就診可綁定一份表單草稿。</p><button onclick="toast('此處將開啟既有表單系統；線框未串接')">建立／開啟表單草稿 ↗</button></section><aside class="panel"><h2>批價與交接摘要</h2><label>處方與費用明細</label><textarea placeholder="此處將接入現有開藥與批價編輯器" oninput="update(${p.id},'items',this.value)">${esc(p.items||'')}</textarea><label>應收金額（NT$）</label><input type="number" min="0" value="${p.amount}" ${p.billed?'disabled':''} oninput="update(${p.id},'amount',Math.max(0,Number(this.value)))"><label>櫃台交辦／飼主提醒</label><textarea oninput="update(${p.id},'handoff',this.value)">${esc(p.handoff)}</textarea><label>回診需求與建議期間</label><input placeholder="例如：7 天後追蹤傷口" value="${esc(p.follow)}" oninput="update(${p.id},'follow',this.value)"><small>櫃台與飼主確認實際預約時段。</small></aside></div><div class="footer"><small id="saved">示範自動儲存 · 重新整理會重置</small><button ${p.billed?'disabled':''} onclick="action(${p.id},'bill')">${p.billed?'批價完成':'完成批價，送交櫃台'}</button><button class="primary" ${p.visit?'disabled':''} onclick="action(${p.id},'visit')">${p.visit?'看診完成':'完成看診'}</button></div>`}
function deskPanel(){const p=patients.find(p=>p.id===selected);if(!p)return '<aside class="panel"><h2>行政處理</h2><p>選擇病患，處理報到、收款與回診安排。</p></aside>';return `<aside class="panel"><h2>${p.name} · 行政處理</h2>${tags(p)}${!p.arrived?`<div class="bar"><button class="primary" onclick="action(${p.id},'arrive')">確認報到</button><button onclick="action(${p.id},'absent')">標記未到</button></div>`:''}<h2>收款</h2>${p.billed?`<strong style="font-size:28px">NT$${p.amount.toLocaleString()}</strong><p>${esc(p.items||'依醫師確認批價收款')}</p><label>付款方式</label><select onchange="update(${p.id},'payment',this.value)"><option>現金</option><option ${p.payment==='信用卡'?'selected':''}>信用卡</option><option ${p.payment==='轉帳'?'selected':''}>轉帳</option></select><div class="bar"><button class="primary" ${p.paid?'disabled':''} onclick="action(${p.id},'pay')">${p.paid?'收款完成':'確認收款'}</button></div>`:'<p>等待醫師完成批價</p>'}<h2>醫師交辦</h2><div class="notice">${esc(p.handoff||'尚無交辦')}</div><h2>回診安排</h2><p>${esc(p.follow||'未指定回診需求')}</p>${p.follow?p.booked?`<span class="tag done">已預約 ${esc(p.booked.replace('T',' '))}</span>`:`<label for="booking">與飼主確認日期時間</label><input id="booking" type="datetime-local"><div class="bar"><button onclick="action(${p.id},'book')">確認預約</button><button onclick="toast('保留於待安排回診，不影響收款')">稍後確認</button></div>`:''}</aside>`}
render();
</script></html>
